name: Nightly full suite
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
jobs:
  full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - run: npm ci
      # Packages are NOT npm workspaces — each has its own lockfile and node_modules
      - name: Install every package
        run: for p in packages/*/; do (cd "$p" && npm ci); done
      - name: Build packages that ship a dist (dependency order)
        run: for p in foundation projects artifacts terminal messaging spine supervision agent-runtime agents server shell; do node -e "process.exit(require(process.argv[1]).scripts?.build?0:1)" "./packages/$p/package.json" && (cd "packages/$p" && npm run build); done
      - run: npm run test:full
