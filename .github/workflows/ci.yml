name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/*/package-lock.json
      - run: npm ci
      # Packages are NOT npm workspaces — each has its own lockfile and node_modules.
      # A fresh CI checkout has neither, and guards/tests read package code + dists.
      - name: Install every package
        run: for p in packages/*/; do (cd "$p" && npm ci); done
      - name: Build packages that ship a dist (dependency order)
        run: for p in foundation spine projects artifacts terminal transcript messaging supervision agent-runtime agents server shell; do node -e "process.exit(require(process.argv[1]).scripts?.build?0:1)" "./packages/$p/package.json" && (cd "packages/$p" && npm run build); done
      - run: npm run messaging:test
      - run: npm run test:guards
      - run: npx tsc --noEmit
      # ponytail: no test runner in repo; plain tsx scripts, discovered by name
      - run: |
          for t in $(find src -name '*.test.ts' -not -path '*/node_modules/*'); do
            npx tsx "$t"
          done
      - run: npm run stores:test
      - run: npm run lint
      - run: npm run build
