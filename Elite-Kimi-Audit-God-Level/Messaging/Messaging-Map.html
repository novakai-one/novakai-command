<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaging — Module Map</title>
<style>
  :root { --speed: 700ms; }
  html[data-theme="paper"] {
    --bg:#f6f5f2; --panel:#ffffff; --ink:#1f2733; --muted:#5d6879; --line:#e4e7ee;
    --accent:#3a5bbf; --accent-soft:#eef2fd; --good:#1e9e6a; --mid:#b57e10; --bad:#cf4534;
    --chip:#f0f2f8; --shadow:0 10px 30px rgba(25,35,60,.06);
  }
  html[data-theme="cloud"] {
    --bg:#eef3fa; --panel:#fbfdff; --ink:#1a2334; --muted:#63718a; --line:#cad5e3;
    --accent:#3f68b7; --accent-soft:#e7eefa; --good:#188a5e; --mid:#a07310; --bad:#c24940;
    --chip:#e9eef6; --shadow:0 10px 30px rgba(35,55,90,.08);
  }
  html[data-theme="midnight"] {
    --bg:#0b101b; --panel:#121928; --ink:#e8edf7; --muted:#9ea9bf; --line:#36415a;
    --accent:#7e9bda; --accent-soft:#1c2740; --good:#4fc08d; --mid:#d9a83f; --bad:#e07884;
    --chip:#1d2740; --shadow:0 10px 30px rgba(0,0,0,.35);
  }
  html[data-theme="graphite"] {
    --bg:#14161b; --panel:#1d2027; --ink:#e9ebf2; --muted:#a6adbd; --line:#41454f;
    --accent:#8fa2d3; --accent-soft:#262b3a; --good:#4fae7e; --mid:#c9a04a; --bad:#d98a92;
    --chip:#272b36; --shadow:0 10px 30px rgba(0,0,0,.3);
  }
  * { box-sizing: border-box; }
  body { margin:0; font:15.5px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); transition:background var(--speed) ease,color var(--speed) ease; }
  button { font:inherit; color:inherit; }

  /* ---------- layout ---------- */
  .app { display:flex; min-height:100vh; }
  .panel { background:var(--panel); overflow:hidden; transition:width var(--speed) ease,opacity var(--speed) ease,padding var(--speed) ease,border-color var(--speed) ease; }
  #leftPanel  { width:300px; border-right:1px solid var(--line); }
  #rightPanel { width:280px; border-left:1px solid var(--line); }
  #leftPanel.closed, #rightPanel.closed { width:0; opacity:0; border-color:transparent; }
  .panel-inner { width:300px; padding:18px 16px 40px; height:100vh; overflow-y:auto; position:sticky; top:0; }
  #rightPanel .panel-inner { width:280px; }
  .center { flex:1; min-width:0; padding:26px 34px 80px; transition:padding var(--speed) ease; }

  .collapse-btn { position:fixed; top:14px; z-index:20; width:30px; height:30px; border-radius:99px; border:1px solid var(--line); background:var(--panel); cursor:pointer; font-size:13px; box-shadow:var(--shadow); transition:left var(--speed) ease,right var(--speed) ease,background .3s; }
  #collapseLeft  { left:282px; }
  #collapseLeft.moved { left:10px; }
  #collapseRight { right:252px; }
  #collapseRight.moved { right:10px; }
  .collapse-btn:hover { background:var(--accent-soft); }

  /* ---------- header ---------- */
  .eyebrow { display:block; font-size:12px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); }
  h1 { font-size:26px; margin:4px 0 2px; letter-spacing:-.3px; }
  .sub { color:var(--muted); font-size:13.5px; margin:0 0 22px; }

  /* ---------- tree ---------- */
  .tree-folder { margin:14px 0 4px; font-size:11.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); }
  .tree-folder span { font-weight:400; text-transform:none; letter-spacing:0; }
  .node { display:block; width:100%; text-align:left; border:0; background:transparent; padding:5px 10px; border-radius:8px; cursor:pointer; font-size:13.5px; font-family:"SF Mono",Menlo,monospace; transition:background .2s; }
  .node:hover { background:var(--accent-soft); }
  .node.active { background:var(--accent); color:#fff; }
  .node.traced { box-shadow:inset 3px 0 0 var(--good); }
  .node .badge { float:right; font-size:10px; padding:1px 7px; border-radius:99px; background:var(--chip); color:var(--muted); font-family:inherit; }
  .compact .node { padding:2px 10px; font-size:12.5px; }

  /* ---------- cards ---------- */
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:22px 26px; box-shadow:var(--shadow); margin:0 0 18px; transition:background var(--speed) ease,border-color var(--speed) ease; }
  .card h2 { margin:0 0 2px; font-size:19px; font-family:"SF Mono",Menlo,monospace; letter-spacing:-.3px; }
  .card .loc { color:var(--muted); font-size:12.5px; font-family:"SF Mono",Menlo,monospace; }
  .pill { display:inline-block; border-radius:99px; padding:2px 10px; font-size:11px; font-weight:700; margin-left:6px; vertical-align:middle; }
  .pill.proposed { background:#ece7f8; color:#6d54b8; }
  html[data-theme="midnight"] .pill.proposed, html[data-theme="graphite"] .pill.proposed { background:#2b2544; color:#b7a3e8; }
  .pill.slice { background:var(--chip); color:var(--muted); }
  .kv { display:grid; grid-template-columns:96px 1fr; gap:6px 14px; margin-top:14px; font-size:14px; }
  .kv dt { color:var(--muted); font-weight:600; font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; padding-top:2px; }
  .kv dd { margin:0; }
  .dep { display:inline-block; background:var(--chip); border-radius:8px; padding:2px 10px; margin:0 6px 6px 0; font-size:12.5px; font-family:"SF Mono",Menlo,monospace; cursor:pointer; border:1px solid transparent; }
  .dep:hover { border-color:var(--accent); color:var(--accent); }

  /* ---------- traces ---------- */
  .trace-tabs { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 14px; }
  .trace-tab { border:1px solid var(--line); background:var(--panel); border-radius:99px; padding:6px 14px; cursor:pointer; font-size:13px; transition:all .2s; }
  .trace-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .step { display:flex; gap:12px; align-items:flex-start; padding:9px 0; border-bottom:1px dashed var(--line); }
  .step:last-child { border-bottom:0; }
  .step-num { flex:none; width:24px; height:24px; border-radius:99px; background:var(--accent); color:#fff; font-size:12px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
  .step-mod { font-family:"SF Mono",Menlo,monospace; font-size:13.5px; cursor:pointer; color:var(--accent); }
  .step-mod:hover { text-decoration:underline; }
  .step-note { color:var(--muted); font-size:13px; margin-top:2px; }

  /* ---------- settings ---------- */
  .set-group { margin:0 0 22px; }
  .set-title { font-size:11.5px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .theme-opt { display:flex; align-items:center; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:10px; margin:0 0 6px; cursor:pointer; font-size:13.5px; transition:all .2s; }
  .theme-opt.active { border-color:var(--accent); background:var(--accent-soft); }
  .swatches { display:flex; gap:3px; }
  .swatches i { width:12px; height:12px; border-radius:3px; display:block; }
  .toggle { display:flex; align-items:center; justify-content:space-between; padding:7px 0; font-size:13.5px; cursor:pointer; }
  .toggle input { accent-color:var(--accent); width:17px; height:17px; cursor:pointer; }
  .hint { font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5; }
</style>
</head>
<body>

<button class="collapse-btn" id="collapseLeft" title="Toggle map panel">◀</button>
<button class="collapse-btn" id="collapseRight" title="Toggle settings panel">▶</button>

<div class="app">
  <aside class="panel" id="leftPanel"><div class="panel-inner" id="treeHost"></div></aside>

  <main class="center" id="centerHost">
    <span class="eyebrow">Messaging capability · module map · pass 1</span>
    <h1 id="pageTitle">Module Map</h1>
    <p class="sub">Tree on the left — select any module to inspect it. Traces below show how behaviour flows through the same names.</p>
    <div id="cardHost"></div>
    <div class="trace-tabs" id="traceTabs"></div>
    <div class="card" id="traceHost" style="display:none"></div>
  </main>

  <aside class="panel" id="rightPanel"><div class="panel-inner" id="settingsHost"></div></aside>
</div>

<script>
/* ============================================================
   DATA — curated prose; enumerations machine-verified.
   Every list copied from the contract source (commands, queries,
   events, errors, seam ops) is checked by contract/check-map-drift.mjs
   — run it after any contract or map edit (law #3).
   status: proposed | accepted | built
   ============================================================ */
const FOLDERS = [
  { id: "public",      label: "public/ — the door", },
  { id: "decide",      label: "core/decide/ — pure decisions" },
  { id: "effect",      label: "core/effect/ — orchestration" },
  { id: "state",       label: "core/state/ — records + state machines" },
  { id: "seams",       label: "seams/ — private interfaces" },
  { id: "adapters",    label: "adapters/ — replaceable" },
  { id: "protocol",    label: "protocol/ — inbound only" },
  { id: "composition", label: "composition/" },
];

const MODULES = [
  // ---- public ----
  { id:"commands", folder:"public", name:"contract/commands.ts", slice:"contract", status:"accepted",
    purpose:"The 8 command shapes — every way a caller can ask Messaging to change something. Frozen in contract/messaging-contract.json.",
    exposes:"OpenPresence · ClosePresence · SendMessage · SendFromTemplate · SetDndPolicy · SetContactPolicy · UpsertTemplate · RetireTemplate",
    dependsOn:["ids","errors","results"] },
  { id:"queries", folder:"public", name:"contract/queries.ts", slice:"contract", status:"accepted",
    purpose:"The 9 query shapes — read truth, never change it. GetInbox returns pending/held Deliveries only — terminal states never appear.",
    exposes:"GetThread · ListThreadsForPerson · GetMessages · GetInbox · GetDelivery · GetPolicy · ListTemplates · GetPresence · GetCapabilities",
    dependsOn:["ids"] },
  { id:"events", folder:"public", name:"contract/events.ts", slice:"contract", status:"accepted",
    purpose:"The 4 event shapes. MessageCommitted/DeliveryUpdated/PolicyChanged are committed-fact (journaled, replayable by cursor); PresenceChanged is an observation — live only, never journaled (R11).",
    exposes:"MessageCommitted · DeliveryUpdated · PresenceChanged · PolicyChanged",
    dependsOn:["ids"] },
  { id:"subscriptions", folder:"public", name:"contract/subscriptions.ts", slice:"contract", status:"accepted",
    purpose:"The Subscribe operation (R1): events + optional thread scope + resume cursor. Result is a frame stream — started · event · ended — every frame carries subscriptionId.",
    exposes:"Subscribe · SubscribeInput · SubscriptionMessage",
    dependsOn:["ids","events"] },
  { id:"errors", folder:"public", name:"contract/errors.ts", slice:"contract", status:"accepted",
    purpose:"The 13 typed, actionable failures — the catalogue lives ONLY in contract/messaging-contract.json (law #3). RateLimited is forward-reserved. DependencyUnavailable covers store/membership/authority/clock; dependency is open-typed — consumers tolerate unknown values.",
    exposes:"NotAuthenticated · NotAuthorized · UnknownRecipient · UnknownThread · UnknownMessage · BlockedByContactPolicy · ValidationFailed · TemplateNotFound · TemplateFieldMismatch · VersionUnsupported · RateLimited · IdempotencyConflict · DependencyUnavailable",
    dependsOn:[] },
  { id:"results", folder:"public", name:"contract/results.ts", slice:"contract", status:"accepted",
    purpose:"Typed success outcomes — SendAccepted carries messageId, threadId, sequence, and urgentDowngraded (which survives idempotent retries via the AcceptanceRecord).",
    exposes:"SendAccepted · PresenceOpened · PresenceClosed · PolicyUpdated · TemplateUpserted · TemplateRetired · CapabilityView",
    dependsOn:["ids"] },
  { id:"ids", folder:"public", name:"contract/ids.ts", slice:"contract", status:"accepted",
    purpose:"Branded, prefix-patterned ID types — a PersonId can never be passed where a ThreadId belongs. Plus Sequence and the opaque Cursor (s_<n>).",
    exposes:"PersonId · ThreadId · MessageId · PresenceId · DeliveryId · AttemptId · TemplateId · SnapshotId · AcceptanceId · PolicyId · SubscriptionId · ClientMessageId · Sequence · Cursor",
    dependsOn:[] },
  { id:"schemas", folder:"public", name:"schemas/", slice:"contract", status:"accepted",
    purpose:"Runtime validators for every contract shape — GENERATED from contract/messaging-contract.json (law #3). External input arrives as unknown and is parsed here.",
    exposes:"parseCommand · parseQuery · parseEvent · parseSubscriptionFrame",
    dependsOn:["commands","queries","events","subscriptions"] },
  { id:"door", folder:"public", name:"index.ts", slice:"contract", status:"accepted",
    purpose:"The MessagingCapability interface — the ONLY importable surface. Package exports make everything else unreachable.",
    exposes:"messaging.commands · messaging.queries · messaging.subscribe",
    dependsOn:["commands","queries","events","subscriptions","errors"] },

  // ---- core/decide ----
  { id:"addressing", folder:"decide", name:"addressing.ts", slice:"S1", status:"accepted",
    purpose:"Resolves an address to a destination: person:<id> → canonical direct thread; thread:<id> → thread by ID — direct threads require sender ∈ pair (R4).",
    exposes:"resolveAddress(address, ctx) → ThreadId",
    dependsOn:["directThread"] },
  { id:"directThread", folder:"decide", name:"directThread.ts", slice:"S1", status:"accepted",
    purpose:"Derives the canonical direct thread for a pair of Persons — one thread per pair, forever (DEC-03).",
    exposes:"directThreadId(a: PersonId, b: PersonId) → ThreadId",
    dependsOn:["ids"] },
  { id:"sendDecision", folder:"decide", name:"sendDecision.ts", slice:"S1", status:"accepted",
    purpose:"The ONE decision point for sending: validate → membership (rooms) → contact policy → priority/DND → typed outcome. Pure — no I/O.",
    exposes:"decideSend(cmd, ctx) → SendOutcome | TypedError",
    dependsOn:["addressing","policyDecision","idempotency"] },
  { id:"policyDecision", folder:"decide", name:"policyDecision.ts", slice:"S1", status:"accepted",
    purpose:"All attention rules in one place: DND hold, override-grant check (boolean, global — R10), contact allow/deny. Ships minimal with S1 (the orchestrator depends on it); the full attention ruleset activates in S3. Re-evaluated at EVERY attempt decision (R5) — never cached.",
    exposes:"checkPolicy(principal, recipient, priority) → Allow | Hold | Deny | Downgrade",
    dependsOn:["ids"] },
  { id:"idempotency", folder:"decide", name:"idempotency.ts", slice:"S1", status:"accepted",
    purpose:"Computes the requestHash (A5). The reservation + dedupe itself happens atomically INSIDE commitAcceptance (DEC-18/20) — no find-then-append anywhere. Maps the duplicate (return original, with urgentDowngraded) and conflict (IdempotencyConflict) outcomes.",
    exposes:"requestHash(cmd) → Hash · mapOutcome(duplicate | conflict)",
    dependsOn:["ids"] },
  { id:"templateRender", folder:"decide", name:"templateRender.ts", slice:"S4", status:"accepted",
    purpose:"Renders a template with caller fields into a validated message draft — bindings restricted to the templateBindablePaths allowlist (R12).",
    exposes:"renderTemplate(templateId, fields) → MessageDraft",
    dependsOn:["ids","errors"] },

  // ---- core/effect ----
  { id:"sendPipeline", folder:"effect", name:"sendPipeline.ts", slice:"S1", status:"accepted",
    purpose:"The only send path: decide → commit → orchestrate. No other route can create a message.",
    exposes:"run(cmd, principal) → SendAccepted | TypedError",
    dependsOn:["sendDecision","commitJournal","deliveryOrchestrator","eventBus"] },
  { id:"commitJournal", folder:"effect", name:"commitJournal.ts", slice:"S1", status:"accepted",
    purpose:"THE commit boundary (DEC-09/20): ONE atomic commitAcceptance — thread get-or-create, idempotency reservation, sequence assignment, message + snapshot + deliveries + effectsPending marker.",
    exposes:"commitAcceptance(input) → AcceptanceOutcome",
    dependsOn:["store"] },
  { id:"recoverySweep", folder:"effect", name:"recoverySweep.ts", slice:"S1", status:"accepted",
    purpose:"DEC-21 eventual-effect: on startup and periodically, drives every effectsPending acceptance to completion — deliveries, events, transport scheduling. Idempotent.",
    exposes:"sweep() → void",
    dependsOn:["store","deliveryOrchestrator","eventBus"] },
  { id:"deliveryOrchestrator", folder:"effect", name:"deliveryOrchestrator.ts", slice:"S1", status:"accepted",
    purpose:"The R5 machine's driver: fan-out across live presences (first real effect wins via store CAS), bounded retry budget, presence-open re-triggers, DND hold/release.",
    exposes:"orchestrate(message, recipients) → void",
    dependsOn:["delivery","presence","presenceTransport","policyDecision"] },
  { id:"eventBus", folder:"effect", name:"eventBus.ts", slice:"S1", status:"accepted",
    purpose:"Emits committed-fact events — only after the fact they report is durable. PresenceChanged flows live as an observation (R11).",
    exposes:"emit(event) · subscribe(listener)",
    dependsOn:["events"] },
  { id:"subscriptionPusher", folder:"effect", name:"subscriptionPusher.ts", slice:"S3", status:"accepted",
    purpose:"The observation lane (R1/R2): payload filtered to threads each subscriber may READ (R3) — the only content filter; per-subscription bounded buffer; cursor replay from the journal after disconnect; overflow ends the subscription — the core never blocks on a slow subscriber.",
    exposes:"subscribe(input, principal) → stream · replay(cursor) · end(id, reason)",
    dependsOn:["eventBus","store","presenceTransport","membership"] },
  { id:"inboxProjection", folder:"effect", name:"inboxProjection.ts", slice:"S3", status:"accepted",
    purpose:"The held/pending view per Person — non-terminal Deliveries only. Derived from the journal — rebuildable, never authoritative.",
    exposes:"inboxFor(personId) → MessagePage",
    dependsOn:["store","message"] },

  // ---- core/state ----
  { id:"thread", folder:"state", name:"thread.ts", slice:"S1", status:"accepted",
    purpose:"Thread records and lifecycle — direct (canonical pair) and room (external membership ref). Owns 'every message belongs to exactly one thread' (I2).",
    exposes:"Thread · createDirect · createRoom",
    dependsOn:["ids"] },
  { id:"message", folder:"state", name:"message.ts", slice:"S1", status:"accepted",
    purpose:"The message record and its invariants: unique ID, one thread, schema fields (I1–I3), ≤ messageMaxBytes (R13).",
    exposes:"Message · validateMessage",
    dependsOn:["ids"] },
  { id:"delivery", folder:"state", name:"delivery.ts", slice:"S1", status:"accepted",
    purpose:"The R5 state machine: pending → held | delivered | failed. Terminal states never leave. held exits via dnd-released or in-flight-effect only.",
    exposes:"Delivery · transition(delivery, trigger)",
    dependsOn:["ids"] },
  { id:"presence", folder:"state", name:"presence.ts", slice:"S1", status:"accepted",
    purpose:"The live-connection registry. Explicit OpenPresence only (R9); one close path for owner-close, disconnect, and liveness timeout. Ephemeral — never an address.",
    exposes:"open(personId) → Presence · close(presenceId) · liveFor(personId)",
    dependsOn:["ids"] },
  { id:"policy", folder:"state", name:"policy.ts", slice:"S3", status:"accepted",
    purpose:"DND (on/off, O3) and contact policy records per Person, with optimistic-concurrency revisions.",
    exposes:"DndPolicy · ContactPolicy · get/set",
    dependsOn:["ids"] },
  { id:"template", folder:"state", name:"template.ts", slice:"S4", status:"accepted",
    purpose:"Template records — fields bound to allowlisted message schema paths (R12).",
    exposes:"MessageTemplate · upsert · retire",
    dependsOn:["ids"] },

  // ---- seams ----
  { id:"authority", folder:"seams", name:"authority.ts", slice:"S1", status:"accepted",
    purpose:"Seam (Seams §2): credential → Principal + session-scoped grants; revalidate with degraded-state ruling. Role→grant mapping lives in adapter CONFIG (DEC-07) — core sees booleans only.",
    exposes:"authenticate(credential) → AuthOutcome · revalidate(sessionId)",
    dependsOn:["ids"] },
  { id:"membership", folder:"seams", name:"membership.ts", slice:"S2", status:"accepted",
    purpose:"Seam (Seams §3): room → member PersonIds + revision evidence, resolved fresh inside every accept call (R8 — no cached rosters). isMember serves read-time authorization (R3).",
    exposes:"resolveMembers(room) → members + evidence · isMember(room, personId)",
    dependsOn:["ids"] },
  { id:"presenceTransport", folder:"seams", name:"presenceTransport.ts", slice:"S1", status:"accepted",
    purpose:"Seam (Seams §4): the delivery effect — deliver (addressed lane) and push (observation lane), plus onDisconnect/onLivenessTimeout callbacks. 'delivered' requires a real effect (G10).",
    exposes:"deliver(presenceId, payload) → EffectReport · push(presenceId, frame) · onDisconnect · onLivenessTimeout",
    dependsOn:["ids","message"] },
  { id:"store", folder:"seams", name:"store.ts", slice:"S1", status:"accepted",
    purpose:"Seam (Store-Seam): atomic commitAcceptance (DEC-20), global sequence + opaque cursors (DEC-19), delivery CAS, recovery scan (DEC-21), typed failure vocabulary.",
    exposes:"commitAcceptance · transitionDelivery · findAcceptance · getMessages · getInbox · scanJournal · listPendingAcceptances · markEffectsSettled",
    dependsOn:["ids"] },
  { id:"clock", folder:"seams", name:"clock.ts", slice:"S1", status:"accepted",
    purpose:"Seam (Seams §5): time + branded ID factory. Display-only timestamps — never ordering keys (DEC-19). Exists so tests can substitute determinism.",
    exposes:"now() → Timestamp · newId(kind) → Id",
    dependsOn:[] },

  // ---- adapters ----
  { id:"authority-local", folder:"adapters", name:"authority-local/", slice:"S1", status:"accepted",
    purpose:"Local token authority adapter. Verifies provisioned Person credentials; maps role assertions to grants via CONFIG (the 7 roles live here, never in core).",
    exposes:"satisfies the authority seam",
    dependsOn:["authority"] },
  { id:"membership-novakai", folder:"adapters", name:"membership-novakai/", slice:"S2", status:"accepted",
    purpose:"Resolves team/mission membership from the Novakai stores (read-only — never writes them) and returns revision evidence per resolution.",
    exposes:"satisfies the membership seam",
    dependsOn:["membership"] },
  { id:"transport-pty", folder:"adapters", name:"transport-pty/", slice:"S1", status:"accepted",
    purpose:"Delivers by typing into the agent's terminal (PTY). The steer path for urgent messages. Liveness = process liveness.",
    exposes:"satisfies the presence-transport seam",
    dependsOn:["presenceTransport"] },
  { id:"transport-ws", folder:"adapters", name:"transport-ws/", slice:"S1", status:"accepted",
    purpose:"Delivers as a WebSocket frame and pushes subscription frames to connected presences. Liveness = ping/timeout.",
    exposes:"satisfies the presence-transport seam",
    dependsOn:["presenceTransport"] },
  { id:"store-jsonl", folder:"adapters", name:"store-jsonl/", slice:"S1", status:"accepted",
    purpose:"Append-only JSONL file store with write-then-fsync discipline. The standalone production default (A4). Sequence counter persists with each commit.",
    exposes:"satisfies the store seam",
    dependsOn:["store"] },
  { id:"store-memory", folder:"adapters", name:"store-memory/", slice:"S1", status:"accepted",
    purpose:"In-memory store. TEST/HARNESS ONLY (A4) — no durability claims; the P6 harness runs entirely on this.",
    exposes:"satisfies the store seam",
    dependsOn:["store"] },

  // ---- protocol ----
  { id:"ws-server", folder:"protocol", name:"ws-server/", slice:"S1", status:"accepted",
    purpose:"Standalone mode (INBOUND, DEC-17): versioned JSON-over-WebSocket. Translates — never decides. Carries commands, queries, and the subscription stream.",
    exposes:"the public contract over the wire",
    dependsOn:["door","schemas"] },
  { id:"cli", folder:"protocol", name:"cli/", slice:"S1", status:"accepted",
    purpose:"Operator CLI over the same core (INBOUND). nvk-style verbs map 1:1 to public commands/queries.",
    exposes:"send · inbox · watch · policy",
    dependsOn:["door"] },

  // ---- composition ----
  { id:"embedded", folder:"composition", name:"embedded.ts", slice:"S1", status:"accepted",
    purpose:"Composition root for in-process hosts. Chooses adapters, owns the revalidation timer (Seams §2.1) — the only place embedded adapters are chosen.",
    exposes:"createMessaging(config) → MessagingCapability",
    dependsOn:["door"] },
  { id:"standalone", folder:"composition", name:"standalone.ts", slice:"S1", status:"accepted",
    purpose:"Composition root for WS/CLI mode. Wires the protocol adapters to the same core; offers only registered transports (Seams §4 composition rule).",
    exposes:"serve(config) → void",
    dependsOn:["door","ws-server","cli"] },
];

const TRACES = [
  { id:"t1", title:"Send a 1-1 message", slice:"S1",
    steps:[
      { mod:"commands", note:"SendMessage arrives with an address and a retry-safe clientMessageId" },
      { mod:"door", note:"the only way in — nothing private is reachable" },
      { mod:"sendPipeline", note:"the single send path: decide → commit → orchestrate" },
      { mod:"sendDecision", note:"validate → contacts → priority — one decision point, pure" },
      { mod:"addressing", note:"person:id resolves to the pair's direct thread" },
      { mod:"commitJournal", note:"COMMIT — message + frozen snapshot are durable from here" },
      { mod:"deliveryOrchestrator", note:"one delivery per recipient, across live presences" },
      { mod:"transport-pty", note:"the effect: typed into the recipient's terminal" },
      { mod:"eventBus", note:"MessageCommitted + DeliveryUpdated announced after the fact" },
    ]},
  { id:"t2", title:"Urgent message against DND", slice:"S3",
    steps:[
      { mod:"sendPipeline", note:"same single path — urgent is a field, not a side channel" },
      { mod:"sendDecision", note:"hands the priority question to policy" },
      { mod:"policyDecision", note:"DND on + no override grant → Downgrade (typed, never silent)" },
      { mod:"delivery", note:"state: held — the message waits, pullable via inbox" },
      { mod:"inboxProjection", note:"recipient pulls it later — nothing lost" },
      { mod:"eventBus", note:"with the grant instead: orchestrate → PTY steer → delivered" },
    ]},
  { id:"t3", title:"Crash after acceptance, then retry", slice:"S1",
    steps:[
      { mod:"sendPipeline", note:"decide passed, commit in progress" },
      { mod:"commitJournal", note:"message durable — process dies before the reply" },
      { mod:"commands", note:"client retries with the SAME clientMessageId and content" },
      { mod:"commitJournal", note:"commitAcceptance returns duplicate — the reservation is atomic (DEC-18/20), no pre-check race" },
      { mod:"idempotency", note:"duplicate outcome mapped to the original acceptance, urgentDowngraded included" },
      { mod:"message", note:"exactly one message exists. Invariant I1 holds." },
    ]},
  { id:"t4", title:"W4 — Chief subscribe push (MSG-023)", slice:"S3",
    steps:[
      { mod:"ws-server", note:"external Chief connects over the standalone protocol — no Novakai app needed" },
      { mod:"authority", note:"authenticate → Principal + grants — identity is born at the seam, never in payloads" },
      { mod:"presence", note:"OpenPresence — explicit registration; authentication alone never registers (R9)" },
      { mod:"subscriptions", note:"Subscribe{events:[MessageCommitted]} — the push contract (R1)" },
      { mod:"sendPipeline", note:"meanwhile a worker sends to the room thread — same single send path" },
      { mod:"membership", note:"room resolved fresh at acceptance; sender ∈ members from the SAME resolution; revision frozen (R8)" },
      { mod:"commitJournal", note:"commitAcceptance — atomic; sequence assigned; durable from here (DEC-19/20)" },
      { mod:"eventBus", note:"MessageCommitted emitted ONLY after the fact is durable" },
      { mod:"subscriptionPusher", note:"OBSERVATION lane (R2): not a Delivery, not DND-gated — filtered to subscribers who may READ the thread (R3), buffered per subscription" },
      { mod:"transport-ws", note:"push: frame onto the Chief's live socket — near-real-time, never polled (MSG-023)" },
      { mod:"presence", note:"socket dies → onDisconnect → presence closes; PresenceChanged(closed) is an OBSERVATION — live-only, never journaled (R11); subscription ends (best-effort ended{closed})" },
      { mod:"store", note:"reconnect → Subscribe{since: last cursor} → scanJournal replays sequence > cursor…" },
      { mod:"subscriptionPusher", note:"…then live frames resume. Catch-up without polling — the anti-polling law holds." },
    ]},
];

/* ============================================================
   RENDER — everything below is driven by the data above.
   ============================================================ */
const $ = s => document.querySelector(s);
const SETTINGS_KEY = "msg-map-settings";
const state = Object.assign({
  theme:"paper", showStatus:true, showExposes:true, showDeps:true, showSlice:true,
  traceHighlight:true, compactTree:false, selected:null, trace:null,
}, JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}"));
const save = () => localStorage.setItem(SETTINGS_KEY, JSON.stringify(state));

function applySettings() {
  document.documentElement.dataset.theme = state.theme;
  $("#leftPanel").classList.toggle("compact", state.compactTree);
  renderTree(); renderCard(); renderSettings(); renderTrace();
}

/* ----- tree ----- */
function renderTree() {
  $("#treeHost").innerHTML = `<div class="set-title">Map — select a module</div>` +
    FOLDERS.map(f => {
      const mods = MODULES.filter(m => m.folder === f.id);
      if (!mods.length) return "";
      return `<div class="tree-folder">${f.label}</div>` + mods.map(m => {
        const traced = state.traceHighlight && currentTraceModules().has(m.id);
        const badge = (state.showSlice ? `<span class="badge">${m.slice}</span>` : "") +
                      (state.showStatus && m.status !== "built" ? `<span class="badge">${m.status}</span>` : "");
        return `<button class="node ${state.selected===m.id?"active":""} ${traced?"traced":""}" data-mod="${m.id}">${m.name}${badge}</button>`;
      }).join("");
    }).join("");
  $("#treeHost").querySelectorAll("[data-mod]").forEach(b =>
    b.onclick = () => { state.selected = b.dataset.mod; save(); renderTree(); renderCard(); });
}

/* ----- card ----- */
function renderCard() {
  const m = MODULES.find(x => x.id === state.selected);
  if (!m) { $("#cardHost").innerHTML = `<div class="card"><p class="sub" style="margin:0">Select a module from the map, or a trace below.</p></div>`; return; }
  const rows = [
    ["Purpose", m.purpose],
    state.showExposes ? ["Exposes", m.exposes] : null,
    state.showDeps && m.dependsOn.length ? ["Depends on", m.dependsOn.map(d =>
      `<span class="dep" data-dep="${d}">${d}</span>`).join("")] : null,
  ].filter(Boolean).map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  $("#cardHost").innerHTML = `<div class="card">
    <h2>${m.name}
      ${state.showStatus?`<span class="pill proposed">${m.status}</span>`:""}
      ${state.showSlice?`<span class="pill slice">${m.slice}</span>`:""}
    </h2>
    <div class="loc">${folderLabel(m.folder)}</div>
    <dl class="kv">${rows}</dl>
  </div>`;
  $("#cardHost").querySelectorAll("[data-dep]").forEach(el =>
    el.onclick = () => { const t = MODULES.find(x => x.id === el.dataset.dep); if (t) { state.selected = t.id; save(); renderTree(); renderCard(); } });
}
const folderLabel = id => (FOLDERS.find(f => f.id === id) || {}).label || id;

/* ----- traces ----- */
function currentTraceModules() {
  const t = TRACES.find(x => x.id === state.trace);
  return new Set(t ? t.steps.map(s => s.mod) : []);
}
function renderTrace() {
  $("#traceTabs").innerHTML = TRACES.map(t =>
    `<button class="trace-tab ${state.trace===t.id?"active":""}" data-trace="${t.id}">${t.title} · ${t.slice}</button>`).join("");
  $("#traceTabs").querySelectorAll("[data-trace]").forEach(b =>
    b.onclick = () => { state.trace = state.trace === b.dataset.trace ? null : b.dataset.trace; save(); renderTrace(); renderTree(); });
  const t = TRACES.find(x => x.id === state.trace);
  const host = $("#traceHost");
  if (!t) { host.style.display = "none"; return; }
  host.style.display = "";
  host.innerHTML = `<h2 style="font-family:inherit">${t.title}</h2>` +
    t.steps.map((s, i) => {
      const m = MODULES.find(x => x.id === s.mod);
      return `<div class="step"><span class="step-num">${i+1}</span><div>
        <span class="step-mod" data-stepmod="${s.mod}">${m ? m.name : s.mod}</span>
        <div class="step-note">${s.note}</div></div></div>`;
    }).join("");
  host.querySelectorAll("[data-stepmod]").forEach(el =>
    el.onclick = () => { state.selected = el.dataset.stepmod; save(); renderTree(); renderCard(); $("#cardHost").scrollIntoView({behavior:"smooth"}); });
}

/* ----- settings ----- */
const THEMES = [
  { id:"paper",    label:"Paper",    sw:["#f6f5f2","#3a5bbf","#1f2733"] },
  { id:"cloud",    label:"Cloud",    sw:["#eef3fa","#3f68b7","#1a2334"] },
  { id:"midnight", label:"Midnight", sw:["#0b101b","#7e9bda","#e8edf7"] },
  { id:"graphite", label:"Graphite", sw:["#14161b","#8fa2d3","#e9ebf2"] },
];
const TOGGLES = [
  ["showStatus","Status badges","proposed / accepted / built pills"],
  ["showSlice","Slice tags","which delivery slice owns each module"],
  ["showExposes","Exposes","what each module surfaces"],
  ["showDeps","Dependencies","module dependency chips (clickable)"],
  ["traceHighlight","Trace highlight","green edge on modules in the active trace"],
  ["compactTree","Compact map","denser tree rows"],
];
function renderSettings() {
  $("#settingsHost").innerHTML = `
    <div class="set-group"><div class="set-title">Theme</div>
      ${THEMES.map(t => `<div class="theme-opt ${state.theme===t.id?"active":""}" data-theme-opt="${t.id}">
        <span class="swatches">${t.sw.map(c=>`<i style="background:${c}"></i>`).join("")}</span>${t.label}</div>`).join("")}
    </div>
    <div class="set-group"><div class="set-title">Show / hide</div>
      ${TOGGLES.map(([k,label,hint]) => `<label class="toggle">${label}
        <input type="checkbox" data-toggle="${k}" ${state[k]?"checked":""}></label>`).join("")}
      <p class="hint">Settings persist in this browser. The map renders from one data array — edits stay cheap.</p>
    </div>`;
  $("#settingsHost").querySelectorAll("[data-theme-opt]").forEach(el =>
    el.onclick = () => { state.theme = el.dataset.themeOpt; save(); applySettings(); });
  $("#settingsHost").querySelectorAll("[data-toggle]").forEach(el =>
    el.onchange = () => { state[el.dataset.toggle] = el.checked; save(); applySettings(); });
}

/* ----- panel collapse (700ms) ----- */
$("#collapseLeft").onclick = () => {
  $("#leftPanel").classList.toggle("closed");
  $("#collapseLeft").classList.toggle("moved");
  $("#collapseLeft").textContent = $("#leftPanel").classList.contains("closed") ? "▶" : "◀";
};
$("#collapseRight").onclick = () => {
  $("#rightPanel").classList.toggle("closed");
  $("#collapseRight").classList.toggle("moved");
  $("#collapseRight").textContent = $("#rightPanel").classList.contains("closed") ? "◀" : "▶";
};

applySettings();
</script>
</body>
</html>
