<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messaging — Module Map (visual)</title>
<style>
/* ============================================================
   THEMES — add one by copying a block; everything reads vars.
   ============================================================ */
html[data-theme="paper"] {
  --bg:#f6f5f2; --panel:#ffffff; --ink:#1f2733; --muted:#5d6879; --line:#e4e7ee;
  --accent:#3a5bbf; --accent-soft:#eef2fd; --chip:#f0f2f8;
  --shadow:0 10px 30px rgba(25,35,60,.08);
  --box-sat:52%; --box-light:92%; --box-line:38%;
}
html[data-theme="cloud"] {
  --bg:#eef3fa; --panel:#fbfdff; --ink:#1a2334; --muted:#63718a; --line:#cad5e3;
  --accent:#3f68b7; --accent-soft:#e7eefa; --chip:#e9eef6;
  --shadow:0 10px 30px rgba(35,55,90,.10);
  --box-sat:48%; --box-light:90%; --box-line:36%;
}
html[data-theme="midnight"] {
  --bg:#0b101b; --panel:#121928; --ink:#e8edf7; --muted:#9ea9bf; --line:#36415a;
  --accent:#7e9bda; --accent-soft:#1c2740; --chip:#1d2740;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --box-sat:38%; --box-light:20%; --box-line:62%;
}
html[data-theme="graphite"] {
  --bg:#14161b; --panel:#1d2027; --ink:#e9ebf2; --muted:#a6adbd; --line:#41454f;
  --accent:#8fa2d3; --accent-soft:#262b3a; --chip:#272b36;
  --shadow:0 10px 30px rgba(0,0,0,.3);
  --box-sat:30%; --box-light:22%; --box-line:60%;
}

* { box-sizing:border-box; }
html, body { height:100%; }
body {
  margin:0; display:flex; flex-direction:column; overflow:hidden;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--ink);
  transition:background .4s ease, color .4s ease;
}
button { font:inherit; color:inherit; }
.mono { font-family:"SF Mono",Menlo,monospace; }

/* ---------- top bar ---------- */
#topbar {
  flex:none; display:flex; align-items:center; gap:18px;
  padding:10px 18px; border-bottom:1px solid var(--line); background:var(--panel);
  z-index:30;
}
.brand { flex:none; }
.brand .eyebrow { display:block; font-size:10.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase; color:var(--accent); }
.brand h1 { font-size:17px; margin:0; letter-spacing:-.2px; }
#traceTabs { flex:1; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.trace-tab {
  border:1px solid var(--line); background:var(--panel); border-radius:99px;
  padding:5px 13px; cursor:pointer; font-size:12.5px; transition:all .2s;
}
.trace-tab:hover { border-color:var(--accent); color:var(--accent); }
.trace-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
.top-actions { flex:none; display:flex; gap:8px; }
.top-btn {
  border:1px solid var(--line); background:var(--panel); border-radius:9px;
  padding:6px 12px; cursor:pointer; font-size:12.5px; transition:all .2s;
}
.top-btn:hover { background:var(--accent-soft); border-color:var(--accent); }

/* ---------- canvas ---------- */
#canvas { flex:1; width:100%; cursor:grab; display:block; }
#canvas.panning { cursor:grabbing; }

.band-label {
  font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase;
  fill:var(--muted);
}
.band-rule { stroke:var(--line); stroke-dasharray:2 5; }

.edge { fill:none; stroke:var(--muted); stroke-width:1.3; opacity:var(--arrow-op,.5); transition:opacity .25s; }
.edge.hot { stroke:var(--accent); opacity:.95; stroke-width:2; }
.edge.dim, .box.dim, .band-label.dim { opacity:var(--dim,.18); }
.edge, .box, .band-label { transition:opacity .25s; }

.box { cursor:pointer; }
.box rect.body { stroke-width:1.5; transition:stroke .2s; }
.box:hover rect.body { stroke:var(--accent); }
.box.selected rect.body { stroke:var(--accent); stroke-width:2.5; }
.box .name { font-family:"SF Mono",Menlo,monospace; font-size:11.5px; fill:var(--ink); text-anchor:middle; }
.box .meta { font-size:9.5px; fill:var(--muted); text-anchor:middle; letter-spacing:.4px; }
.box .order { display:none; }
.box .order.on { display:inline; }
.box .order circle { fill:var(--accent); }
.box .order text { fill:#fff; font-size:10px; font-weight:700; text-anchor:middle; }
.box.current rect.body { stroke:var(--accent); stroke-width:3; animation:pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { stroke-opacity:1; } 50% { stroke-opacity:.25; } }

.trace-seg { fill:none; stroke:var(--accent); stroke-width:3; opacity:.85; }
.callout rect { fill:var(--panel); stroke:var(--accent); stroke-width:1.5; }
.callout line { stroke:var(--accent); stroke-width:1.5; }
.callout text { font-family:"SF Mono",Menlo,monospace; font-size:11.5px; }
.callout .c-call { fill:var(--accent); }
.callout .c-ret { fill:var(--ink); font-weight:600; }
#token { display:none; }
#token.on { display:inline; }
#token circle.core { fill:var(--accent); stroke:var(--panel); stroke-width:2.5; }
#token circle.halo { fill:none; stroke:var(--accent); opacity:.5; animation:halo 1.4s ease-out infinite; }
@keyframes halo { 0% { r:8; opacity:.55; } 100% { r:20; opacity:0; } }

/* ---------- overlays (tooltip / dock / panels) ---------- */
.overlay { position:fixed; z-index:40; background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); }
#tooltip {
  padding:10px 14px; max-width:320px; font-size:13px; pointer-events:none;
}
#tooltip .t-name { font-family:"SF Mono",Menlo,monospace; font-size:12px; color:var(--accent); margin-bottom:3px; }

#dock { left:18px; bottom:18px; width:400px; max-width:calc(100vw - 36px); padding:18px 20px; }
#dock h2 { margin:0 0 2px; font-size:16px; font-family:"SF Mono",Menlo,monospace; }
#dock .loc { color:var(--muted); font-size:11.5px; font-family:"SF Mono",Menlo,monospace; }
#dock .kv { display:grid; grid-template-columns:88px 1fr; gap:5px 12px; margin-top:10px; font-size:13px; }
#dock .kv dt { color:var(--muted); font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.5px; padding-top:2px; }
#dock .kv dd { margin:0; }
.pill { display:inline-block; border-radius:99px; padding:1px 9px; font-size:10.5px; font-weight:700; margin-left:6px; vertical-align:middle; background:var(--chip); color:var(--muted); }
.dep { display:inline-block; background:var(--chip); border-radius:8px; padding:1px 9px; margin:0 5px 5px 0; font-size:12px; font-family:"SF Mono",Menlo,monospace; cursor:pointer; border:1px solid transparent; }
.dep:hover { border-color:var(--accent); color:var(--accent); }
.close-x { position:absolute; top:10px; right:12px; border:0; background:none; font-size:15px; cursor:pointer; color:var(--muted); }
.close-x:hover { color:var(--ink); }

/* ---------- trace panel ---------- */
#tracePanel { right:18px; top:74px; bottom:18px; width:330px; display:flex; flex-direction:column; overflow:hidden; }
#tracePanel header { flex:none; padding:14px 16px 10px; border-bottom:1px solid var(--line); }
#tracePanel h2 { margin:0; font-size:15px; }
#tracePanel .controls { display:flex; gap:6px; margin-top:10px; }
.tp-btn { flex:1; border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:5px 0; cursor:pointer; font-size:12px; transition:all .15s; }
.tp-btn:hover { background:var(--accent-soft); border-color:var(--accent); }
.tp-btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
#stepList { flex:1; overflow-y:auto; padding:8px 10px 20px; }
#tracePanel:not([hidden]) { display:flex; }
#tracePanel[hidden] { display:none; }
.step { display:flex; gap:10px; align-items:flex-start; padding:8px 8px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
.step:hover { background:var(--accent-soft); }
.step.current { background:var(--accent-soft); border-color:var(--accent); }
.step-num { flex:none; width:22px; height:22px; border-radius:99px; background:var(--chip); color:var(--muted); font-size:11px; font-weight:700; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.step.current .step-num, .step.done .step-num { background:var(--accent); color:#fff; }
.step-mod { font-family:"SF Mono",Menlo,monospace; font-size:12.5px; }
.step-call { font-family:"SF Mono",Menlo,monospace; font-size:11px; color:var(--accent); margin-top:2px; }
.step-call .ret { color:var(--ink); font-weight:600; }
.step-note { color:var(--muted); font-size:12px; margin-top:1px; }

/* ---------- settings drawer ---------- */
#drawer { right:18px; top:74px; bottom:18px; width:300px; overflow-y:auto; padding:18px; transform:translateX(0); transition:transform .3s ease, opacity .3s ease; }
#drawer[hidden] { display:block; transform:translateX(340px); opacity:0; pointer-events:none; }
.set-group { margin:0 0 20px; }
.set-title { font-size:11px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
.seg { display:flex; flex-wrap:wrap; gap:5px; }
.seg button { border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; transition:all .15s; }
.seg button.active { border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600; }
.toggle { display:flex; align-items:center; justify-content:space-between; padding:6px 0; font-size:13px; cursor:pointer; }
.toggle input { accent-color:var(--accent); width:16px; height:16px; cursor:pointer; }
.range-row { padding:4px 0 8px; font-size:13px; }
.range-row .val { float:right; color:var(--muted); font-size:12px; font-family:"SF Mono",Menlo,monospace; }
.range-row input { width:100%; accent-color:var(--accent); cursor:pointer; }
.hint { font-size:11.5px; color:var(--muted); line-height:1.5; }
</style>
</head>
<body>

<header id="topbar">
  <div class="brand">
    <span class="eyebrow">Messaging capability · pass 1</span>
    <h1>Module Map</h1>
  </div>
  <nav id="traceTabs"></nav>
  <div class="top-actions">
    <button class="top-btn" id="fitBtn" title="Zoom to fit (double-click canvas)">Fit</button>
    <button class="top-btn" id="gearBtn" title="Settings">⚙ Settings</button>
  </div>
</header>

<svg id="canvas" tabindex="0">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"></path>
    </marker>
    <marker id="arrowTrace" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"></path>
    </marker>
  </defs>
  <g id="world"></g>
</svg>

<div id="tooltip" class="overlay" hidden></div>

<section id="dock" class="overlay" hidden></section>

<aside id="tracePanel" class="overlay" hidden></aside>

<aside id="drawer" class="overlay" hidden></aside>

<script>
/* ============================================================
   1. CONFIG — geometry & behaviour defaults.
   Tweak here for permanent changes; the Settings drawer exposes
   the same knobs for live tweaking (and persists per browser).
   ============================================================ */
const CONFIG = {
  box:   { w: 178, h: 58 },      // module box size (px, before zoom)
  gap:   { x: 26, y: 78 },       // base spacing (multiplied by `density` setting)
  gutter: 150,                   // band label column (rows) / row (columns)
  pad:   46,                     // canvas padding around the whole map
  zoom:  { min: 0.18, max: 2.6 },
  storageKey: "msg-map-visual-v1",
};

const DEFAULT_SETTINGS = {
  theme: "paper",
  orientation: "rows",           // rows: bands top→bottom · columns: bands left→right
  showArrows: true,
  arrowStyle: "curved",          // curved | straight
  arrowOpacity: 0.5,
  showSlice: true,
  showBandLabels: true,
  density: 1,                    // 0.7 tight – 1.4 airy
  autoplay: true,
  animateToken: true,
  stepMs: 620,                   // token travel time between two steps
  dwellMs: 950,                  // pause at each step
  showTracePath: true,
  dim: 0.18,                     // opacity of de-emphasised boxes
};

/* ============================================================
   2. DATA — the map itself. Edit here; everything renders from
   these arrays. `hue` drives each band's colour in every theme.
   ============================================================ */
const FOLDERS = [
  { id: "public",      label: "public/ — the door",            hue: 222 },
  { id: "decide",      label: "core/decide/ — pure decisions", hue: 162 },
  { id: "effect",      label: "core/effect/ — orchestration",  hue: 268 },
  { id: "state",       label: "core/state/ — records + state", hue: 20  },
  { id: "seams",       label: "seams/ — private interfaces",   hue: 190 },
  { id: "adapters",    label: "adapters/ — replaceable",       hue: 330 },
  { id: "protocol",    label: "protocol/ — inbound only",      hue: 96  },
  { id: "composition", label: "composition/",                  hue: 44  },
];

const MODULES = [
  // ---- public ----
  { id:"commands", folder:"public", name:"contract/commands.ts", slice:"contract", status:"proposed",
    purpose:"The 8 command shapes — every way a caller can ask Messaging to change something.",
    exposes:"OpenPresence · ClosePresence · SendMessage · SendFromTemplate · SetDndPolicy · SetContactPolicy · UpsertTemplate · RetireTemplate",
    dependsOn:["ids","errors","results"] },
  { id:"queries", folder:"public", name:"contract/queries.ts", slice:"contract", status:"proposed",
    purpose:"The 9 query shapes — read truth, never change it.",
    exposes:"GetThread · ListThreadsForPerson · GetMessages · GetInbox · GetDelivery · GetPolicy · ListTemplates · GetPresence · GetCapabilities",
    dependsOn:["ids"] },
  { id:"events", folder:"public", name:"contract/events.ts", slice:"contract", status:"proposed",
    purpose:"The 4 committed-fact announcements pushed to subscribers.",
    exposes:"MessageCommitted · DeliveryUpdated · PresenceChanged · PolicyChanged",
    dependsOn:["ids"] },
  { id:"errors", folder:"public", name:"contract/errors.ts", slice:"contract", status:"proposed",
    purpose:"The 12 typed, actionable failures. No failure is ever a bare string.",
    exposes:"NotAuthenticated · NotAuthorized · UnknownRecipient · UnknownThread · UnknownMessage · BlockedByContactPolicy · ValidationFailed · TemplateNotFound · TemplateFieldMismatch · VersionUnsupported · RateLimited",
    dependsOn:[] },
  { id:"results", folder:"public", name:"contract/results.ts", slice:"contract", status:"proposed",
    purpose:"Typed success outcomes — SendAccepted carries messageId, threadId, and the urgentDowngraded flag.",
    exposes:"SendAccepted · PresenceOpened · PolicyUpdated · TemplateUpserted",
    dependsOn:["ids"] },
  { id:"ids", folder:"public", name:"contract/ids.ts", slice:"contract", status:"proposed",
    purpose:"Branded ID types — a PersonId can never be passed where a ThreadId belongs.",
    exposes:"PersonId · ThreadId · MessageId · PresenceId · TemplateId · ClientMessageId",
    dependsOn:[] },
  { id:"schemas", folder:"public", name:"schemas/", slice:"contract", status:"proposed",
    purpose:"Runtime validators for every contract shape. External input arrives as unknown and is parsed here — strict TypeScript alone is not enough at the wire.",
    exposes:"parseCommand · parseQuery · parseEvent",
    dependsOn:["commands","queries","events"] },
  { id:"door", folder:"public", name:"index.ts", slice:"contract", status:"proposed",
    purpose:"The MessagingCapability interface — the ONLY importable surface. Package exports make everything else unreachable.",
    exposes:"messaging.commands · messaging.queries · messaging.subscribe",
    dependsOn:["commands","queries","events","errors"] },

  // ---- core/decide ----
  { id:"addressing", folder:"decide", name:"addressing.ts", slice:"S1", status:"proposed",
    purpose:"Resolves an address to a destination: person:id → direct thread, thread:id → room.",
    exposes:"resolveAddress(address, ctx) → ThreadId",
    dependsOn:["directThread"] },
  { id:"directThread", folder:"decide", name:"directThread.ts", slice:"S1", status:"proposed",
    purpose:"Derives the canonical direct thread for a pair of Persons — one thread per pair, forever (DEC-03).",
    exposes:"directThreadId(a: PersonId, b: PersonId) → ThreadId",
    dependsOn:["ids"] },
  { id:"sendDecision", folder:"decide", name:"sendDecision.ts", slice:"S1", status:"proposed",
    purpose:"The ONE decision point for sending: validate → contact policy → priority/DND → typed outcome. Pure — no I/O.",
    exposes:"decideSend(cmd, ctx) → SendOutcome | TypedError",
    dependsOn:["addressing","policyDecision","idempotency"] },
  { id:"policyDecision", folder:"decide", name:"policyDecision.ts", slice:"S3", status:"proposed",
    purpose:"All attention rules in one place: DND hold, override-grant check, contact allow/deny. Nothing decides policy anywhere else.",
    exposes:"checkPolicy(principal, recipient, priority) → Allow | Hold | Deny | Downgrade",
    dependsOn:["ids"] },
  { id:"idempotency", folder:"decide", name:"idempotency.ts", slice:"S1", status:"proposed",
    purpose:"clientMessageId dedupe — a retry returns the original acceptance, never a duplicate (DEC-13).",
    exposes:"checkDuplicate(senderId, clientMessageId) → MessageId | null",
    dependsOn:["ids"] },
  { id:"templateRender", folder:"decide", name:"templateRender.ts", slice:"S4", status:"proposed",
    purpose:"Renders a template with caller fields into a validated message draft (DEC-15).",
    exposes:"renderTemplate(templateId, fields) → MessageDraft",
    dependsOn:["ids","errors"] },

  // ---- core/effect ----
  { id:"sendPipeline", folder:"effect", name:"sendPipeline.ts", slice:"S1", status:"proposed",
    purpose:"The only send path: decide → commit → orchestrate. No other route can create a message.",
    exposes:"run(cmd, principal) → SendAccepted | TypedError",
    dependsOn:["sendDecision","commitJournal","deliveryOrchestrator","eventBus"] },
  { id:"commitJournal", folder:"effect", name:"commitJournal.ts", slice:"S1", status:"proposed",
    purpose:"THE commit boundary (DEC-09): message + frozen recipient snapshot become durable before any delivery effect runs.",
    exposes:"commit(message, snapshot) → void",
    dependsOn:["store"] },
  { id:"deliveryOrchestrator", folder:"effect", name:"deliveryOrchestrator.ts", slice:"S1", status:"proposed",
    purpose:"Fans out per-recipient delivery across all live presences; settles delivered only on a real adapter effect (I11).",
    exposes:"orchestrate(message, recipients) → DeliveryView[]",
    dependsOn:["delivery","presence","presenceTransport"] },
  { id:"eventBus", folder:"effect", name:"eventBus.ts", slice:"S1", status:"proposed",
    purpose:"Emits the 4 public events — only after the fact they report is durable.",
    exposes:"emit(event) · subscribe(listener)",
    dependsOn:["events"] },
  { id:"inboxProjection", folder:"effect", name:"inboxProjection.ts", slice:"S3", status:"proposed",
    purpose:"The held/undelivered view per Person. Derived from the journal — rebuildable, never authoritative.",
    exposes:"inboxFor(personId) → MessagePage",
    dependsOn:["store","message"] },

  // ---- core/state ----
  { id:"thread", folder:"state", name:"thread.ts", slice:"S1", status:"proposed",
    purpose:"Thread records and lifecycle — direct and room. Owns 'every message belongs to exactly one thread' (I2).",
    exposes:"Thread · createDirect · createRoom",
    dependsOn:["ids"] },
  { id:"message", folder:"state", name:"message.ts", slice:"S1", status:"proposed",
    purpose:"The message record and its invariants: unique ID, one thread, schema fields (I1–I3).",
    exposes:"Message · validateMessage",
    dependsOn:["ids"] },
  { id:"delivery", folder:"state", name:"delivery.ts", slice:"S1", status:"proposed",
    purpose:"Per-recipient delivery state machine: pending → pushed → delivered | held | failed.",
    exposes:"Delivery · transition(delivery, event)",
    dependsOn:["ids"] },
  { id:"presence", folder:"state", name:"presence.ts", slice:"S1", status:"proposed",
    purpose:"The live-connection registry. Ephemeral by design — never an address (DEC-02).",
    exposes:"open(personId) → Presence · close(presenceId) · liveFor(personId)",
    dependsOn:["ids"] },
  { id:"policy", folder:"state", name:"policy.ts", slice:"S3", status:"proposed",
    purpose:"DND and contact policy records per Person.",
    exposes:"DndPolicy · ContactPolicy · get/set",
    dependsOn:["ids"] },
  { id:"template", folder:"state", name:"template.ts", slice:"S4", status:"proposed",
    purpose:"Template records — fields bound to message schema paths.",
    exposes:"MessageTemplate · upsert · retire",
    dependsOn:["ids"] },

  // ---- seams ----
  { id:"authority", folder:"seams", name:"authority.ts", slice:"S1", status:"proposed",
    purpose:"Seam: credential → authenticated Principal + grants. Trust boundary — sender identity is born here, never in payloads.",
    exposes:"authenticate(credential) → Principal · grants(principal)",
    dependsOn:["ids"] },
  { id:"membership", folder:"seams", name:"membership.ts", slice:"S2", status:"proposed",
    purpose:"Seam: thread:id → recipient PersonIds at acceptance time. Team/mission membership truth stays with its external owner.",
    exposes:"resolveMembers(threadId) → PersonId[]",
    dependsOn:["ids"] },
  { id:"presenceTransport", folder:"seams", name:"presenceTransport.ts", slice:"S1", status:"proposed",
    purpose:"Seam: the actual delivery effect to a live runtime. Adapters report effects; 'delivered' requires one (G10).",
    exposes:"deliver(presence, message) → EffectReport",
    dependsOn:["ids","message"] },
  { id:"store", folder:"seams", name:"store.ts", slice:"S1", status:"proposed",
    purpose:"Seam: durable commit + ordered reads. Replaceable infrastructure.",
    exposes:"append(record) · read(threadId, cursor) · find(predicate)",
    dependsOn:["ids"] },
  { id:"clock", folder:"seams", name:"clock.ts", slice:"S1", status:"proposed",
    purpose:"Seam: time + ID factory. Exists so tests can substitute determinism.",
    exposes:"now() → Timestamp · newId(kind) → Id",
    dependsOn:[] },

  // ---- adapters ----
  { id:"authority-local", folder:"adapters", name:"authority-local/", slice:"S1", status:"proposed",
    purpose:"Local token authority adapter. Verifies provisioned Person credentials; issues grants.",
    exposes:"satisfies the authority seam",
    dependsOn:["authority"] },
  { id:"membership-novakai", folder:"adapters", name:"membership-novakai/", slice:"S2", status:"proposed",
    purpose:"Resolves team/mission membership from the Novakai stores (read-only — never writes them).",
    exposes:"satisfies the membership seam",
    dependsOn:["membership"] },
  { id:"transport-pty", folder:"adapters", name:"transport-pty/", slice:"S1", status:"proposed",
    purpose:"Delivers by typing into the agent's terminal (PTY). The steer path for urgent messages.",
    exposes:"satisfies the presence-transport seam",
    dependsOn:["presenceTransport"] },
  { id:"transport-ws", folder:"adapters", name:"transport-ws/", slice:"S1", status:"proposed",
    purpose:"Delivers as a WebSocket frame to connected presences.",
    exposes:"satisfies the presence-transport seam",
    dependsOn:["presenceTransport"] },
  { id:"store-jsonl", folder:"adapters", name:"store-jsonl/", slice:"S1", status:"proposed",
    purpose:"Append-only JSONL file store. The default production adapter.",
    exposes:"satisfies the store seam",
    dependsOn:["store"] },
  { id:"store-memory", folder:"adapters", name:"store-memory/", slice:"S1", status:"proposed",
    purpose:"In-memory store. Tests and the standalone harness run entirely on this.",
    exposes:"satisfies the store seam",
    dependsOn:["store"] },

  // ---- protocol ----
  { id:"ws-server", folder:"protocol", name:"ws-server/", slice:"S1", status:"proposed",

  { id:"standalone", folder:"composition", name:"standalone.ts", slice:"S1", status:"proposed",
    purpose:"Composition root for WS/CLI mode. Wires the protocol adapters to the same core.",
    exposes:"serve(config) → void",
    dependsOn:["door","ws-server","cli"] },

const TRACES = [
  { id:"t1", title:"Send a 1-1 message", slice:"S1",
    steps:[
      { mod:"commands", call:"SendMessage { to: person:chris, body, clientMessageId }", note:"SendMessage arrives with an address and a retry-safe clientMessageId" },
      { mod:"door", call:"messaging.commands.send(cmd) → SendAccepted | TypedError", note:"the only way in — nothing private is reachable" },
      { mod:"sendPipeline", call:"run(cmd, principal) → SendAccepted | TypedError", note:"the single send path: decide → commit → orchestrate" },
      { mod:"sendDecision", call:"decideSend(cmd, ctx) → SendOutcome | TypedError", note:"validate → contacts → priority — one decision point, pure" },
      { mod:"addressing", call:"resolveAddress(person:chris) → ThreadId", note:"person:id resolves to the pair's direct thread" },
      { mod:"commitJournal", call:"commit(message, snapshot) → durable", note:"COMMIT — message + frozen snapshot are durable from here" },
      { mod:"deliveryOrchestrator", call:"orchestrate(message, recipients) → DeliveryView[]", note:"one delivery per recipient, across live presences" },
      { mod:"transport-pty", call:"deliver(presence, message) → EffectReport", note:"the effect: typed into the recipient's terminal" },
      { mod:"eventBus", call:"emit(MessageCommitted · DeliveryUpdated)", note:"MessageCommitted + DeliveryUpdated announced after the fact" },
    ]},

    steps:[

      { mod:"sendDecision", call:"decideSend(cmd, ctx)", note:"hands the priority question to policy" },
      { mod:"policyDecision", call:"checkPolicy(principal, recipient, urgent) → Downgrade", note:"DND on + no override grant → Downgrade (typed, never silent)" },
      { mod:"delivery", call:"transition(delivery, Hold) → held", note:"state: held — the message waits, pullable via inbox" },
      { mod:"inboxProjection", call:"inboxFor(personId) → MessagePage", note:"recipient pulls it later — nothing lost" },
      { mod:"eventBus", call:"with grant: orchestrate → deliver → delivered", note:"with the grant instead: orchestrate → PTY steer → delivered" },
    ]},
  { id:"t3", title:"Crash after acceptance, then retry", slice:"S1",
    steps:[
      { mod:"sendPipeline", call:"run(cmd, principal) — decide passed", note:"decide passed, commit in progress" },
      { mod:"commitJournal", call:"commit(message, snapshot) → durable ✕ crash", note:"message durable — process dies before the reply" },
      { mod:"commands", call:"SendMessage { SAME clientMessageId } — retry", note:"client retries with the SAME clientMessageId" },
      { mod:"idempotency", call:"checkDuplicate(senderId, clientMessageId) → MessageId", note:"duplicate detected — return the original acceptance" },

/* ============================================================
   3. STATE — settings persist; view/selection/trace are session.
   ============================================================ */
const $ = s => document.querySelector(s);
const settings = Object.assign({}, DEFAULT_SETTINGS,
  JSON.parse(localStorage.getItem(CONFIG.storageKey) || "{}"));
const save = () => localStorage.setItem(CONFIG.storageKey, JSON.stringify(settings));

const state = { selected: null, trace: null };
const view = { x: 0, y: 0, k: 1 };              // pan + zoom

const modById = id => MODULES.find(m => m.id === id);
const folderOf = m => FOLDERS.find(f => f.id === m.folder);
const activeTrace = () => TRACES.find(t => t.id === state.trace) || null;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

function applyCssVars() {
  const r = document.documentElement;
  r.dataset.theme = settings.theme;
  r.style.setProperty("--dim", settings.dim);
  r.style.setProperty("--arrow-op", settings.arrowOpacity);
}

/* Box colours derive from the band hue + theme lightness knobs. */
function boxColors(m) {
  const h = folderOf(m).hue;
  const cs = getComputedStyle(document.documentElement);
  const sat = cs.getPropertyValue("--box-sat").trim();
  const light = cs.getPropertyValue("--box-light").trim();
  const line = cs.getPropertyValue("--box-line").trim();
  return { fill: `hsl(${h} ${sat} ${light})`, stroke: `hsl(${h} 45% ${line})` };
}

/* ============================================================
   4. LAYOUT — pure function of data + settings.
   Produces pos[id] = {x,y}, band shapes, and canvas extents.
   Rows: bands stacked vertically. Columns: bands side by side.
   ============================================================ */
let layout = null;

function computeLayout() {
  const { w, h } = CONFIG.box;
  const gx = CONFIG.gap.x * settings.density;
  const gy = CONFIG.gap.y * settings.density;
  const rows = settings.orientation === "rows";
  const bands = FOLDERS
    .map(f => ({ f, mods: MODULES.filter(m => m.folder === f.id) }))
    .filter(b => b.mods.length);
  const maxLen = Math.max(...bands.map(b => b.mods.length));
  const pos = {}, bandShapes = [];
  const span = n => n * (rows ? (w + gx) : (h + gx)) - (rows ? gx : gx);
  const mainSpan = maxLen * ((rows ? w : h) + gx) - gx;

  bands.forEach((b, i) => {
    const cross = CONFIG.pad + i * ((rows ? h : w) + gy);
    const len = b.mods.length * ((rows ? w : h) + gx) - gx;
    let main = CONFIG.pad + CONFIG.gutter + (mainSpan - len) / 2;
    b.mods.forEach(m => {
      pos[m.id] = rows
        ? { x: main, y: cross }
        : { x: cross, y: main };
      main += (rows ? w : h) + gx;
    });
    bandShapes.push(rows
      ? { x: CONFIG.pad, y: cross - 14, w: CONFIG.gutter + mainSpan, h: h + 28, f: b.f }
      : { x: cross - 14, y: CONFIG.pad, w: w + 28, h: CONFIG.gutter + mainSpan, f: b.f });
  });

  const W = rows ? CONFIG.pad * 2 + CONFIG.gutter + mainSpan
                 : CONFIG.pad * 2 + bands.length * (w + gy) - gy + 28;
  const H = rows ? CONFIG.pad * 2 + bands.length * (h + gy) - gy + 28
                 : CONFIG.pad * 2 + CONFIG.gutter + mainSpan;
  layout = { pos, bandShapes, W, H, rows };
}

const center = id => {
  const p = layout.pos[id];
  return { x: p.x + CONFIG.box.w / 2, y: p.y + CONFIG.box.h / 2 };
};
/* Edge anchors: leave from the "downstream" side, enter upstream. */
const anchorOut = id => {
  const p = layout.pos[id], { w, h } = CONFIG.box;
  return layout.rows ? { x: p.x + w / 2, y: p.y + h } : { x: p.x + w, y: p.y + h / 2 };
};
const anchorIn = id => {
  const p = layout.pos[id], { w, h } = CONFIG.box;
  return layout.rows ? { x: p.x + w / 2, y: p.y } : { x: p.x, y: p.y + h / 2 };
};

function edgePath(a, b) {
  if (settings.arrowStyle === "straight") return `M${a.x},${a.y} L${b.x},${b.y}`;
  const d = layout.rows ? b.y - a.y : b.x - a.x;
  const bow = Math.max(Math.abs(d) * 0.45, 34) * (d >= 0 ? 1 : -1);
  const c1 = layout.rows ? { x: a.x, y: a.y + bow } : { x: a.x + bow, y: a.y };
  const c2 = layout.rows ? { x: b.x, y: b.y - bow } : { x: b.x - bow, y: b.y };
  return `M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`;
}

/* ============================================================
   5. RENDER — rebuilds the SVG world from layout.
   Cheap (40 nodes); re-run on any settings/layout change.
   ============================================================ */
function render() {
  computeLayout();
  const { w, h } = CONFIG.box;
  let out = "";

  // band labels + rules
  if (settings.showBandLabels) {
    for (const b of layout.bandShapes) {
      const hue = b.f.hue;
      const lx = layout.rows ? b.x + 4 : b.x + 18;
      const ly = layout.rows ? b.y + 18 : b.y + 16;
      out += `<text class="band-label" data-band="${b.f.id}" x="${lx}" y="${ly}" style="fill:hsl(${hue} 40% var(--box-line))">${esc(b.f.label)}</text>`;
      out += layout.rows
        ? `<line class="band-rule" x1="${b.x}" y1="${b.y + b.h}" x2="${b.x + b.w}" y2="${b.y + b.h}"/>`
        : `<line class="band-rule" x1="${b.x + b.w}" y1="${b.y}" x2="${b.x + b.w}" y2="${b.y + b.h}"/>`;
    }
  }

  // dependency edges
  if (settings.showArrows) {
    for (const m of MODULES) {
      for (const dep of m.dependsOn) {
        if (!layout.pos[dep]) continue;
        out += `<path class="edge" data-from="${m.id}" data-to="${dep}" d="${edgePath(anchorOut(m.id), anchorIn(dep))}" marker-end="url(#arrow)"/>`;
      }
    }
  }

  // module boxes
  for (const m of MODULES) {
    const p = layout.pos[m.id], c = boxColors(m);
    const meta = settings.showSlice ? `${m.slice} · ${m.status}` : m.status;
    out += `<g class="box" data-id="${m.id}" transform="translate(${p.x},${p.y})">
      <rect class="body" width="${w}" height="${h}" rx="11" style="fill:${c.fill};stroke:${c.stroke}"/>
      <text class="name" x="${w / 2}" y="${settings.showSlice ? h / 2 - 2 : h / 2 + 4}">${esc(m.name)}</text>
      ${settings.showSlice ? `<text class="meta" x="${w / 2}" y="${h / 2 + 16}">${esc(meta)}</text>` : ""}
      <g class="order"><circle cx="${w - 12}" cy="12" r="10"/><text x="${w - 12}" y="15.5"></text></g>
    </g>`;
  }

  // trace layer (path + token) — filled by buildTraceOverlay()
  out += `<g id="traceLayer"></g>
    <g id="token"><circle class="halo" r="8"/><circle class="core" r="7"/></g>`;

  $("#world").innerHTML = out;
  bindBoxEvents();
  applyEmphasis();
  if (activeTrace()) buildTraceOverlay();
  applyView();
}

/* ============================================================
   6. EMPHASIS — who is dim, who is hot.
   Trace active → only trace modules lit. Otherwise a selection
   lights its dependency neighbourhood.
   ============================================================ */
function applyEmphasis() {
  const t = activeTrace();
  const boxes = $("#world").querySelectorAll(".box");
  const edges = $("#world").querySelectorAll(".edge");

  if (t) {
    const inTrace = new Set(t.steps.map(s => s.mod));
    boxes.forEach(b => b.classList.toggle("dim", !inTrace.has(b.dataset.id)));
    edges.forEach(e => e.classList.add("dim"));
  } else if (state.selected) {
    const nb = new Set([state.selected,
      ...modById(state.selected).dependsOn,
      ...MODULES.filter(m => m.dependsOn.includes(state.selected)).map(m => m.id)]);
    boxes.forEach(b => {
      b.classList.toggle("dim", !nb.has(b.dataset.id));
      b.classList.toggle("selected", b.dataset.id === state.selected);
    });
    edges.forEach(e => {
      const hot = e.dataset.from === state.selected || e.dataset.to === state.selected;
      e.classList.toggle("hot", hot);
      e.classList.toggle("dim", !hot);
    });
  } else {
    boxes.forEach(b => b.classList.remove("dim", "selected"));
    edges.forEach(e => e.classList.remove("dim", "hot"));
  }
}

function bindBoxEvents() {
  $("#world").querySelectorAll(".box").forEach(g => {
    g.addEventListener("click", e => { e.stopPropagation(); selectModule(g.dataset.id); });
    g.addEventListener("mouseenter", e => showTooltip(g.dataset.id, e));
    g.addEventListener("mousemove", moveTooltip);
    g.addEventListener("mouseleave", hideTooltip);
  });
}

function selectModule(id) {
  state.selected = state.selected === id ? null : id;
  applyEmphasis();
  renderDock();
}

/* ============================================================
   7. VIEW — pan/zoom transforms + fit.
   ============================================================ */
function applyView() {
  $("#world").setAttribute("transform", `translate(${view.x},${view.y}) scale(${view.k})`);
}
function fit() {
  const svg = $("#canvas").getBoundingClientRect();
  const k = Math.min(svg.width / layout.W, svg.height / layout.H, 1);
  view.k = k * 0.96;
  view.x = (svg.width - layout.W * view.k) / 2;
  view.y = (svg.height - layout.H * view.k) / 2;
  applyView();
}

/* ============================================================
   8. TRACE PLAYER — a token travels the steps of a trace.
   rAF loop; timing knobs live in settings (stepMs / dwellMs).
   ============================================================ */
const player = { playing: false, idx: 0, phase: "dwell", t0: 0, raf: 0 };
const ease = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

function traceSteps() { return activeTrace()?.steps || []; }

function buildTraceOverlay() {
  const t = activeTrace();
  const layer = $("#traceLayer");
  if (!t) { layer.innerHTML = ""; $("#token").classList.remove("on"); return; }

  // numbered order badges on the boxes
  const order = new Map();
  t.steps.forEach((s, i) => { if (!order.has(s.mod)) order.set(s.mod, i + 1); });
  $("#world").querySelectorAll(".box").forEach(g => {
    const badge = g.querySelector(".order");
    const n = order.get(g.dataset.id);
    badge.classList.toggle("on", !!n);
    if (n) badge.querySelector("text").textContent = n;
  });

  // the visible path
  if (settings.showTracePath) {
    layer.innerHTML = t.steps.slice(1).map((s, i) => {
      const a = center(t.steps[i].mod), b = center(s.mod);
      return `<path class="trace-seg" d="M${a.x},${a.y} L${b.x},${b.y}" marker-end="url(#arrowTrace)"/>`;
    }).join("");
  } else layer.innerHTML = "";

  playerStop(); goToStep(0);
  renderTracePanel();
  if (settings.autoplay) playerPlay();
}

function tokenAt(p) {
  const tok = $("#token");
  tok.classList.add("on");
  tok.setAttribute("transform", `translate(${p.x},${p.y})`);
}

function goToStep(i) {
  const steps = traceSteps();
  player.idx = Math.max(0, Math.min(i, steps.length - 1));
  player.phase = "dwell";
  player.t0 = performance.now();
  tokenAt(center(steps[player.idx].mod));
  markCurrentStep();
}

function markCurrentStep() {
  const steps = traceSteps();
  $("#world").querySelectorAll(".box").forEach(g =>
    g.classList.toggle("current", g.dataset.id === steps[player.idx]?.mod));
  const rows = $("#stepList")?.querySelectorAll(".step");
  rows?.forEach((r, i) => {
    r.classList.toggle("current", i === player.idx);
    r.classList.toggle("done", i < player.idx);
  });
  rows?.[player.idx]?.scrollIntoView({ block: "nearest", behavior: "smooth" });
  renderCallout();
}

/* ---------- call signatures: split "fn(args) → Return" ---------- */
function callParts(call) {
  const i = call.indexOf("→");
  return i < 0 ? { call, ret: "" } : { call: call.slice(0, i).trim(), ret: call.slice(i).trim() };
}

/* Floating bubble next to the token's current stop, showing the
   live call + return type. Follows the player step by step. */
function renderCallout() {
  const layer = $("#traceLayer");
  if (!layer) return;
  layer.querySelectorAll(".callout").forEach(n => n.remove());
  const s = traceSteps()[player.idx];
  if (!s?.call || !layout.pos[s.mod]) return;
  const cp = callParts(s.call);
  const p = layout.pos[s.mod], bw = s.call.length * 6.7 + 24, bh = 30;
  const cx = p.x + CONFIG.box.w / 2;
  const bx = Math.max(8, Math.min(cx - bw / 2, layout.W - bw - 8));
  const above = p.y > 100;
  const by = above ? p.y - 16 - bh : p.y + CONFIG.box.h + 16;
  layer.insertAdjacentHTML("beforeend", `<g class="callout">
    <line x1="${cx}" y1="${above ? p.y : p.y + CONFIG.box.h}" x2="${bx + bw / 2}" y2="${above ? by + bh : by}"/>
    <rect x="${bx}" y="${by}" width="${bw}" height="${bh}" rx="8"/>
    <text x="${bx + 12}" y="${by + 20}"><tspan class="c-call">${esc(cp.call)}</tspan>${cp.ret ? ` <tspan class="c-ret">${esc(cp.ret)}</tspan>` : ""}</text>
  </g>`);
}

function loop(now) {
  const steps = traceSteps();
  if (!player.playing || !steps.length) { player.raf = 0; return; }

  if (player.phase === "move") {
    const p = Math.min(1, (now - player.t0) / settings.stepMs);
    if (settings.animateToken) {
      const a = center(steps[player.idx - 1].mod), b = center(steps[player.idx].mod);
      tokenAt({ x: a.x + (b.x - a.x) * ease(p), y: a.y + (b.y - a.y) * ease(p) });
    }
    if (p === 1) { player.phase = "dwell"; player.t0 = now; tokenAt(center(steps[player.idx].mod)); markCurrentStep(); }
  } else { // dwell
    if (now - player.t0 >= settings.dwellMs) {
      if (player.idx >= steps.length - 1) { playerPause(); return; }
      player.idx++; player.phase = "move"; player.t0 = now;
      if (!settings.animateToken) { tokenAt(center(steps[player.idx].mod)); markCurrentStep(); player.phase = "dwell"; }
    }
  }
  player.raf = requestAnimationFrame(loop);
}

function playerPlay() {
  if (player.idx >= traceSteps().length - 1 && player.phase === "dwell") goToStep(0);
  player.playing = true;
  player.t0 = performance.now();
  if (!player.raf) player.raf = requestAnimationFrame(loop);
  syncPlayButton();
}
function playerPause() { player.playing = false; syncPlayButton(); }
function playerStop() { player.playing = false; if (player.raf) cancelAnimationFrame(player.raf); player.raf = 0; syncPlayButton(); }
function syncPlayButton() {
  const b = $("#playBtn"); if (b) b.textContent = player.playing ? "❚❚ Pause" : "▶ Play";
}

/* ---------- trace panel (step list + controls) ---------- */
function renderTracePanel() {
  const t = activeTrace();
  const host = $("#tracePanel");
  if (!t) { host.hidden = true; return; }
  host.hidden = false;
  host.innerHTML = `<header>
      <h2>${esc(t.title)} <span class="pill">${esc(t.slice)}</span></h2>
      <div class="controls">
        <button class="tp-btn primary" id="playBtn">▶ Play</button>
        <button class="tp-btn" id="prevBtn">← Prev</button>
        <button class="tp-btn" id="nextBtn">Next →</button>
        <button class="tp-btn" id="restartBtn">⟲</button>
      </div>
    </header>
    <div id="stepList">` +
    t.steps.map((s, i) => {
      const m = modById(s.mod);
      const cp = s.call ? callParts(s.call) : null;
      return `<div class="step" data-step="${i}">
        <span class="step-num">${i + 1}</span>
        <div><div class="step-mod">${esc(m ? m.name : s.mod)}</div>
        ${cp ? `<div class="step-call">${esc(cp.call)}${cp.ret ? ` <span class="ret">${esc(cp.ret)}</span>` : ""}</div>` : ""}
        <div class="step-note">${esc(s.note)}</div></div></div>`;
    }).join("") + `</div>`;
  syncPlayButton(); markCurrentStep();
  $("#playBtn").onclick = () => player.playing ? playerPause() : playerPlay();
  $("#prevBtn").onclick = () => { playerPause(); goToStep(player.idx - 1); };
  $("#nextBtn").onclick = () => { playerPause(); goToStep(player.idx + 1); };
  $("#restartBtn").onclick = () => { playerPause(); goToStep(0); };
  host.querySelectorAll(".step").forEach(r =>
    r.onclick = () => { playerPause(); goToStep(+r.dataset.step); });
}

function selectTrace(id) {
  playerStop();
  state.trace = state.trace === id ? null : id;
  state.selected = null;
  renderDock();
  renderTraceTabs();
  applyEmphasis();
  if (activeTrace()) buildTraceOverlay();
  else { $("#traceLayer").innerHTML = ""; $("#token").classList.remove("on");
    $("#world").querySelectorAll(".order").forEach(b => b.classList.remove("on"));
    $("#world").querySelectorAll(".box.current").forEach(b => b.classList.remove("current"));
    renderTracePanel(); }
}

function renderTraceTabs() {
  $("#traceTabs").innerHTML = TRACES.map(t =>
    `<button class="trace-tab ${state.trace === t.id ? "active" : ""}" data-trace="${t.id}">${esc(t.title)} · ${esc(t.slice)}</button>`).join("");
  $("#traceTabs").querySelectorAll("[data-trace]").forEach(b =>
    b.onclick = () => selectTrace(b.dataset.trace));
}

/* ============================================================
   9. DOCK + TOOLTIP
   ============================================================ */
function renderDock() {
  const host = $("#dock");
  const m = modById(state.selected);
  if (!m) { host.hidden = true; return; }
  host.hidden = false;
  const deps = m.dependsOn.map(d =>
    `<span class="dep" data-dep="${d}">${esc(modById(d)?.name || d)}</span>`).join("") || `<span class="hint">none</span>`;
  const users = MODULES.filter(x => x.dependsOn.includes(m.id)).map(x =>
    `<span class="dep" data-dep="${x.id}">${esc(x.name)}</span>`).join("") || `<span class="hint">nobody yet</span>`;
  host.innerHTML = `<button class="close-x" id="dockClose">✕</button>
    <h2>${esc(m.name)}<span class="pill">${esc(m.slice)}</span><span class="pill">${esc(m.status)}</span></h2>
    <div class="loc">${esc(folderOf(m).label)}</div>
    <dl class="kv">
      <dt>Purpose</dt><dd>${esc(m.purpose)}</dd>
      <dt>Exposes</dt><dd>${esc(m.exposes)}</dd>
      <dt>Depends on</dt><dd>${deps}</dd>
      <dt>Used by</dt><dd>${users}</dd>
    </dl>`;
  $("#dockClose").onclick = () => selectModule(m.id); // toggles off
  host.querySelectorAll("[data-dep]").forEach(el =>
    el.onclick = () => selectModule(el.dataset.dep));
}

function showTooltip(id, e) {
  const m = modById(id); if (!m) return;
  const tip = $("#tooltip");
  tip.innerHTML = `<div class="t-name">${esc(m.name)}</div>${esc(m.purpose)}`;
  tip.hidden = false; moveTooltip(e);
}
function moveTooltip(e) {
  const tip = $("#tooltip");
  tip.style.left = Math.min(e.clientX + 16, innerWidth - 340) + "px";
  tip.style.top = Math.min(e.clientY + 16, innerHeight - 120) + "px";
}
function hideTooltip() { $("#tooltip").hidden = true; }

/* ============================================================
   10. SETTINGS DRAWER — declarative. Add a setting: one entry
   here + one default in DEFAULT_SETTINGS. Nothing else.
   type: choice | check | range
   ============================================================ */
const CONTROLS = [
  { group: "Appearance" },
  { key: "theme", label: "Theme", type: "choice",
    options: [["paper", "Paper"], ["cloud", "Cloud"], ["midnight", "Midnight"], ["graphite", "Graphite"]] },
  { key: "orientation", label: "Band direction", type: "choice",
    options: [["rows", "Rows ↓"], ["columns", "Columns →"]], relayout: true },

  { group: "Diagram" },
  { key: "showArrows", label: "Dependency arrows", type: "check" },
  { key: "arrowStyle", label: "Arrow style", type: "choice",
    options: [["curved", "Curved"], ["straight", "Straight"]], relayout: true },
  { key: "arrowOpacity", label: "Arrow opacity", type: "range", min: 0.1, max: 1, step: 0.05 },
  { key: "showSlice", label: "Slice + status on boxes", type: "check" },
  { key: "showBandLabels", label: "Band labels", type: "check" },
  { key: "density", label: "Spacing", type: "range", min: 0.7, max: 1.5, step: 0.05, relayout: true },
  { key: "dim", label: "Dim strength", type: "range", min: 0.05, max: 0.6, step: 0.01 },

  { group: "Trace player" },
  { key: "autoplay", label: "Autoplay on select", type: "check" },
  { key: "animateToken", label: "Animate token movement", type: "check" },
  { key: "stepMs", label: "Travel time / hop", type: "range", min: 200, max: 2000, step: 20, unit: "ms" },
  { key: "dwellMs", label: "Pause at each stop", type: "range", min: 150, max: 3000, step: 50, unit: "ms" },
  { key: "showTracePath", label: "Show trace path line", type: "check" },
];

function renderDrawer() {
  const host = $("#drawer");
  let html = `<button class="close-x" id="drawerClose">✕</button>`;
  for (const c of CONTROLS) {
    if (c.group) { html += `<div class="set-group"><div class="set-title">${c.group}</div>`; continue; }
    if (c.type === "choice") {
      html += `<div class="range-row">${c.label}</div><div class="seg" data-key="${c.key}">` +
        c.options.map(([v, l]) =>
          `<button data-val="${v}" class="${settings[c.key] === v ? "active" : ""}">${l}</button>`).join("") +
        `</div></div><div class="set-group">`;
    } else if (c.type === "check") {
      html += `<label class="toggle">${c.label}
        <input type="checkbox" data-key="${c.key}" ${settings[c.key] ? "checked" : ""}></label>`;
    } else if (c.type === "range") {
      html += `<div class="range-row">${c.label}<span class="val" data-val-of="${c.key}">${settings[c.key]}${c.unit || ""}</span>
        <input type="range" data-key="${c.key}" min="${c.min}" max="${c.max}" step="${c.step}" value="${settings[c.key]}"></div>`;
    }
  }
  html += `<p class="hint">Settings persist in this browser. Layout/geometry defaults live in <span class="mono">CONFIG</span> at the top of the file; module data in <span class="mono">MODULES</span>.</p></div>`;
  host.innerHTML = html;

  $("#drawerClose").onclick = () => { host.hidden = true; };
  host.querySelectorAll(".seg").forEach(seg =>
    seg.querySelectorAll("button").forEach(b => b.onclick = () => {
      updateSetting(seg.dataset.key, b.dataset.val);
    }));
  host.querySelectorAll(`input[type="checkbox"]`).forEach(i =>
    i.onchange = () => updateSetting(i.dataset.key, i.checked));
  host.querySelectorAll(`input[type="range"]`).forEach(i =>
    i.oninput = () => {
      updateSetting(i.dataset.key, +i.value, /*deferRelayout*/ i === document.activeElement);
      host.querySelector(`[data-val-of="${i.dataset.key}"]`).textContent = i.value + (CONTROLS.find(c => c.key === i.dataset.key).unit || "");
    });
}

function updateSetting(key, value, deferRelayout = false) {
  const ctl = CONTROLS.find(c => c.key === key);
  settings[key] = value; save(); applyCssVars();
  if (key === "theme") { renderDrawer(); render(); return; }
  if (ctl?.relayout || ["showArrows", "showSlice", "showBandLabels", "showTracePath"].includes(key)) render();
  renderDrawer(); // keep active states in sync
}

/* ============================================================
   11. CANVAS EVENTS — pan, zoom, keyboard.
   ============================================================ */
function bindCanvas() {
  const svg = $("#canvas");

  svg.addEventListener("pointerdown", e => {
    if (e.target.closest(".box")) return;
    svg.classList.add("panning");
    svg.setPointerCapture(e.pointerId);
    const start = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y };
    const move = ev => { view.x = start.vx + ev.clientX - start.x; view.y = start.vy + ev.clientY - start.y; applyView(); };
    const up = () => { svg.classList.remove("panning"); svg.removeEventListener("pointermove", move); svg.removeEventListener("pointerup", up); };
    svg.addEventListener("pointermove", move);
    svg.addEventListener("pointerup", up);
  });

  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const rect = svg.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const k2 = Math.min(CONFIG.zoom.max, Math.max(CONFIG.zoom.min, view.k * Math.exp(-e.deltaY * 0.0012)));
    view.x = mx - (mx - view.x) * (k2 / view.k);
    view.y = my - (my - view.y) * (k2 / view.k);
    view.k = k2; applyView();
  }, { passive: false });

  svg.addEventListener("dblclick", e => { if (!e.target.closest(".box")) fit(); });
  svg.addEventListener("click", e => {
    if (e.target === svg || e.target.id === "world") {
      if (state.selected) selectModule(state.selected); // toggle off
    }
  });

  addEventListener("keydown", e => {
    if (e.key === "Escape") {
      if (!$("#drawer").hidden) { $("#drawer").hidden = true; return; }
      if (state.trace) { selectTrace(state.trace); return; }
      if (state.selected) selectModule(state.selected);
    }
    if (state.trace && e.key === " ") { e.preventDefault(); player.playing ? playerPause() : playerPlay(); }
    if (state.trace && e.key === "ArrowRight") { playerPause(); goToStep(player.idx + 1); }
    if (state.trace && e.key === "ArrowLeft") { playerPause(); goToStep(player.idx - 1); }
  });

  $("#fitBtn").onclick = fit;
  $("#gearBtn").onclick = () => { const d = $("#drawer"); d.hidden = !d.hidden; if (!d.hidden) renderDrawer(); };
  addEventListener("resize", () => { /* keep current view; Fit button recentres */ });
}

/* ============================================================
   12. INIT
   ============================================================ */
applyCssVars();
renderTraceTabs();
bindCanvas();
render();
fit();
</script>
